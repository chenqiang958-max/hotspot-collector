<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>忘记密码 - 热点收集器</title>
<style>
  :root{--bg:#f4f5fb;--card:#fff;--ink:#1a1c2e;--ink-soft:#6b6f8a;--ink-faint:#a0a3bd;
        --primary:#5b5bd6;--primary-deep:#4747b0;--line:#ececf4;--radius:14px;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC",sans-serif;
       background:var(--bg);color:var(--ink);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .box{background:var(--card);border-radius:20px;box-shadow:0 8px 40px rgba(40,42,80,.12);padding:36px 34px;max-width:420px;width:100%;}
  h1{font-size:22px;font-weight:800;margin:0 0 6px;}
  .sub{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-bottom:20px;}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px;}
  input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--radius);font-size:15px;font-family:inherit;}
  input:focus{outline:none;border-color:var(--primary);}
  input#code{letter-spacing:1px;text-align:center;text-transform:uppercase;}
  button{width:100%;margin-top:22px;padding:13px;border:none;border-radius:100px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s;}
  button:hover{background:var(--primary-deep);}
  .err{color:#e5484d;font-size:13px;margin-top:12px;min-height:18px;font-weight:600;}
  .back{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--ink-soft);text-decoration:none;}
  .back:hover{color:var(--primary);}
</style>
</head>
<body>
  <div class="box">
    <h1>🔑 用激活码重置密码</h1>
    <div class="sub">忘记开机密码了？输入本机激活时用的那个激活码，就可以重新设置一个新密码。</div>
    <label>激活码（本机激活用的那个）</label>
    <input type="text" id="code" placeholder="XXXX-XXXX-XXXX-XXXX" autofocus>
    <label>新密码（至少4位）</label>
    <input type="password" id="new" placeholder="输入新密码">
    <label>再输一遍新密码</label>
    <input type="password" id="new2" placeholder="再输一遍" onkeydown="if(event.key==='Enter')reset()">
    <div class="err" id="err"></div>
    <button onclick="reset()">重置密码并进入</button>
    <a class="back" href="/login">← 想起来了，返回输密码</a>
  </div>
<script>
  function reset(){
    var code=document.getElementById('code').value;
    var n=document.getElementById('new').value;
    var n2=document.getElementById('new2').value;
    var err=document.getElementById('err'); err.textContent='';
    fetch('/forgot',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:code,new:n,new2:n2})})
      .then(r=>r.json()).then(d=>{ if(d.ok){ window.location='/'; } else { err.textContent=d.msg; } });
  }
</script>
</body>
</html>
